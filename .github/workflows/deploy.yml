name: Deploy Node + React App to EC2

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Decode SSH Key
      - name: Decode SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # Start SSH Agent and Add Key
      - name: Start SSH Agent and Add Key
        run: |
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      # Copy files to EC2 using rsync
      - name: Copy files to EC2
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/fullstack-app

      # SSH into EC2 and deploy the app
      - name: SSH into EC2 and deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/fullstack-app

            # Build frontend
            cd client
            npm install
            npm run build

            # Build backend
            cd ../server
            npm install

            # Restart with PM2
            pm2 delete all || true
            pm2 start index.js --name fullstack-app
          EOF
